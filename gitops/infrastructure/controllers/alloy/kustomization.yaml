apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - namespace.yaml
  - alert-rule-contract.yaml
  - usage-dashboard-contract.yaml
helmCharts:
  # Grafana chart 1.11.1 / Alloy 1.18.1. Do not follow latest implicitly.
  - name: alloy
    repo: https://grafana.github.io/helm-charts
    version: 1.11.1
    releaseName: alloy
    namespace: observability
    valuesFile: values.yaml

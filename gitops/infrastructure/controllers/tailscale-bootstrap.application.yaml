apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-bootstrap
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/Nexters/ALIGNER-PLATFORM.git
    targetRevision: main
    path: gitops/infrastructure/configs/cluster-services/bootstrap
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

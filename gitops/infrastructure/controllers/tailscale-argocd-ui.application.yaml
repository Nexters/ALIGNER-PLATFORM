apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-argocd-ui
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/Nexters/ALIGNER-PLATFORM.git
    targetRevision: main
    path: gitops/infrastructure/configs/cluster-services/argocd-ui
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: infisical-cluster-services
  namespace: tailscale
spec:
  provider:
    infisical:
      hostAPI: https://app.infisical.com
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-cluster-services-credentials
            key: clientId
          clientSecret:
            name: infisical-cluster-services-credentials
            key: clientSecret
      secretsScope:
        projectSlug: aligner-cluster-services
        environmentSlug: prod
        secretsPath: /tailscale

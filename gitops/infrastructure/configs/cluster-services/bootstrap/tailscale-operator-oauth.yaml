apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: infisical-cluster-services
  target:
    name: operator-oauth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client_id
      remoteRef:
        key: TAILSCALE_OPERATOR_CLIENT_ID
    - secretKey: client_secret
      remoteRef:
        key: TAILSCALE_OPERATOR_CLIENT_SECRET

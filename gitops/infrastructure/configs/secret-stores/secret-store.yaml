apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: infisical-runtime
  namespace: aligner
spec:
  provider:
    infisical:
      hostAPI: https://app.infisical.com
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-runtime-credentials
            key: clientId
          clientSecret:
            name: infisical-runtime-credentials
            key: clientSecret
      secretsScope:
        projectSlug: aligner-runtime
        environmentSlug: prod
        secretsPath: /apps/aligner-api

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aligner-api
  namespace: traefik
  labels:
    aligner.io/runtime-gate: staging-certificate-ready
spec:
  secretName: aligner-api-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - api.aligneryoga.com
    - aligneryoga.com


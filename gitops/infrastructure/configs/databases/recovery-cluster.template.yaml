# Point-In-Time-Recovery (PITR) Template for CloudNativePG
# Usage:
# 1. Fill TARGET_TIME with desired UTC timestamp (e.g. "2026-08-19 10:00:00.000000+00")
# 2. Ensure secret 'aligner-postgresql-b2-reader' exists in 'aligner-data'
# 3. Apply this manifest to bootstrap 'aligner-db-recovery' without modifying production data
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: aligner-db-recovery
  namespace: aligner-data
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.8
  storage:
    size: 10Gi
  bootstrap:
    recovery:
      source: aligner-db-backup-source
      targetTime: "${TARGET_TIME}"
  externalClusters:
    - name: aligner-db-backup-source
      barmanObjectStore:
        destinationPath: "s3://aligner-prod-backup/cnpg/"
        endpointURL: "https://s3.us-west-004.backblazeb2.com"
        s3Credentials:
          accessKeyId:
            name: aligner-postgresql-b2-reader
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: aligner-postgresql-b2-reader
            key: ACCESS_SECRET_KEY
        wal:
          compression: gzip
          maxParallel: 2

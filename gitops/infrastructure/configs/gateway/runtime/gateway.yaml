apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform-gateway
  namespace: traefik
  labels:
    aligner.io/runtime-gate: public-hostname-and-tls-secret
spec:
  gatewayClassName: platform-traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          # HTTP는 이 namespace의 redirect route만 받는다.
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: api.aligneryoga.com
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: aligner-api-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: "true"

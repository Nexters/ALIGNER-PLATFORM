apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-config
  namespace: local-path-storage
  annotations:
    aligner.nexters.io/data-b-contract: "Provisioning requires the marker written only after the Data-B UUID guard succeeds."
data:
  config.json: |-
    {
      "nodePathMap": [],
      "storageClassConfigs": {
        "local-path": {
          "nodePathMap": [
            {
              "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
              "paths": ["/mnt/aligner"]
            }
          ]
        },
        "aligner-local-path": {
          "nodePathMap": [
            {
              "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
              "paths": ["/mnt/aligner"]
            }
          ]
        }
      }
    }
  setup: |-
    #!/bin/sh
    set -eu
    case "${VOL_DIR}" in
      /mnt/aligner/*) ;;
      *) echo "refusing non-Data-B volume path: ${VOL_DIR}" >&2; exit 1 ;;
    esac
    marker=/mnt/aligner/.aligner-data-b.uuid
    test -s "${marker}"
    uuid="$(tr -d '\n' < "${marker}")"
    echo "${uuid}" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    mkdir -m 0700 -p "${VOL_DIR}"

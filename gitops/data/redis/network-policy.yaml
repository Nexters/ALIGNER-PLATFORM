apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aligner-redis-default-deny
  namespace: aligner-data
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aligner-redis-from-api
  namespace: aligner-data
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: aligner
          podSelector:
            matchLabels:
              app.kubernetes.io/name: aligner-api
      ports:
        - protocol: TCP
          port: 6379

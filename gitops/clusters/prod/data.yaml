apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aligner-prod-data
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2'
    argocd.argoproj.io/sync-options: Delete=false
spec:
  project: default
  source:
    repoURL: https://github.com/Nexters/ALIGNER-PLATFORM.git
    targetRevision: main
    path: gitops/data
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - Prune=confirm

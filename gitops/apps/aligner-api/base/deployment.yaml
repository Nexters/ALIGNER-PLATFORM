# RUNTIME GATE: replace the invalid immutable digest, set measured resources,
# and add documented Spring Boot HTTP probe paths before applying an overlay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aligner-api
  labels:
    app.kubernetes.io/name: aligner-api
    app.kubernetes.io/part-of: aligner
    app.kubernetes.io/component: api
    aligner.io/runtime-gate: image-probes-and-load-test
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: aligner-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aligner-api
        app.kubernetes.io/part-of: aligner
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: aligner-api
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: aligner-api
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: aligner-api
      containers:
        - name: api
          image: ghcr.io/nexters/aligner-server:latest
          imagePullPolicy: Always
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: ACTUATOR_BASE_PATH
              valueFrom:
                secretKeyRef:
                  name: aligner-api-secrets
                  key: ACTUATOR_BASE_PATH
          envFrom:
            - secretRef:
                name: aligner-api-secrets
          readinessProbe:
            httpGet:
              path: $(ACTUATOR_BASE_PATH)/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: $(ACTUATOR_BASE_PATH)/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # Empty until a reviewed load test supplies requests and limits.
          resources: {}

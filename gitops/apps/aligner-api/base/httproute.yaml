apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aligner-api
  labels:
    app.kubernetes.io/name: aligner-api
    app.kubernetes.io/part-of: aligner
spec:
  parentRefs:
    - name: platform-gateway
      namespace: traefik
      sectionName: https
  hostnames:
    - api.aligneryoga.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: aligner-api
          port: 8080

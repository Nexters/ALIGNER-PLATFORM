# RUNTIME GATE: the existing aligner Namespace must be labelled
# gateway-access=true and the approved hostname must replace this placeholder.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aligner-api
  labels:
    app.kubernetes.io/name: aligner-api
    app.kubernetes.io/part-of: aligner
    aligner.io/runtime-gate: namespace-label-and-public-hostname
spec:
  parentRefs:
    - name: platform
      namespace: traefik
      sectionName: https
  hostnames:
    - api.aligner.example.invalid
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: aligner-api
          port: 8080

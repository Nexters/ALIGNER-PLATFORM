apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aligner-api-allow-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aligner-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8080

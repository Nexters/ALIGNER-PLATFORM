apiVersion: apps/v1
kind: Deployment
metadata:
  name: aligner-sandbox-api
  labels:
    app.kubernetes.io/name: aligner-sandbox-api
    app.kubernetes.io/part-of: aligner
    app.kubernetes.io/component: api
    app.kubernetes.io/environment: sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aligner-sandbox-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aligner-sandbox-api
        app.kubernetes.io/part-of: aligner
        app.kubernetes.io/component: api
        app.kubernetes.io/environment: sandbox
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/nexters/aligner-server:develop
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"
          envFrom:
            - secretRef:
                name: aligner-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

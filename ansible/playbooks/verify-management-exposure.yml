---
# Controller-side, read-only checks for issue #17. Endpoint values live in an
# untracked vars file; only TCP connect checks and HTTPS GET requests are used.
- name: Verify management exposure gates
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    management_exposure_runtime_approved: false
    management_exposure_stage: ""
    management_exposure_evidence_ref: ""
    management_exposure_desired_rules_verified: false
    management_exposure_wg_ssh_checks: []
    management_exposure_public_negative_checks: []
    management_exposure_break_glass_evidence_ref: ""
    management_exposure_cleanup_evidence_ref: ""
    management_exposure_wg_api_checks: []
    management_exposure_expected_wg_ssh_checks:
      - primary-k3s-01
      - primary-k3s-02
      - primary-k3s-03
      - secondary-k3s-01
      - secondary-k3s-02
      - secondary-k3s-03
    management_exposure_expected_public_negative_checks:
      - public-tcp-22
      - public-tcp-5432
      - public-tcp-6379
      - public-tcp-6443
    management_exposure_expected_public_negative_ports:
      public-tcp-22: 22
      public-tcp-5432: 5432
      public-tcp-6379: 6379
      public-tcp-6443: 6443

  tasks:
    - name: Stop before any verification command without explicit evidence
      ansible.builtin.assert:
        that:
          - management_exposure_runtime_approved | bool
          - management_exposure_stage in ['pre-lockdown', 'post-lockdown-pre-k3s', 'post-k3s']
          - management_exposure_evidence_ref | length > 0
          - management_exposure_wg_ssh_checks | length == 6
          - management_exposure_wg_ssh_checks | selectattr('host', 'defined') | list | length == 6
          - management_exposure_wg_ssh_checks | map(attribute='name') | list | sort == management_exposure_expected_wg_ssh_checks
          - >-
            management_exposure_stage != 'pre-lockdown' or
            management_exposure_desired_rules_verified | bool
          - >-
            management_exposure_stage != 'pre-lockdown' or
            (management_exposure_break_glass_evidence_ref | length > 0 and
            management_exposure_cleanup_evidence_ref | length > 0)
          - >-
            management_exposure_stage == 'pre-lockdown' or
            (management_exposure_public_negative_checks | length == 4 and
            management_exposure_public_negative_checks | selectattr('host', 'defined') | list | length == 4 and
            management_exposure_public_negative_checks | selectattr('port', 'defined') | list | length == 4 and
            management_exposure_public_negative_checks | map(attribute='name') | list | sort == management_exposure_expected_public_negative_checks)
          - >-
            management_exposure_stage != 'post-k3s' or
            (management_exposure_wg_api_checks | length == 6 and
            management_exposure_wg_api_checks | selectattr('url', 'defined') | list | length == 6 and
            management_exposure_wg_api_checks | map(attribute='name') | list | sort == management_exposure_expected_wg_ssh_checks)
        fail_msg: >-
          Management exposure verification is intentionally not run. Supply an explicit
          stage, evidence reference, and every required read-only check in an untracked
          vars file. No verification command has been executed.

    - name: Bind every public exposure check to its required port
      ansible.builtin.assert:
        that:
          - item.port | int == management_exposure_expected_public_negative_ports[item.name] | int
        fail_msg: Public exposure check names must use their exact required ports.
      loop: "{{ management_exposure_public_negative_checks }}"
      when: management_exposure_stage != 'pre-lockdown'

    - name: Verify both WireGuard profiles reach every node over SSH
      ansible.builtin.wait_for:
        host: "{{ item.host }}"
        port: 22
        state: started
        connect_timeout: 5
        timeout: 10
      changed_when: false
      no_log: true
      loop: "{{ management_exposure_wg_ssh_checks }}"
      loop_control:
        label: "wireguard-ssh-check"

    - name: Verify public management and data ports are unavailable
      ansible.builtin.wait_for:
        host: "{{ item.host }}"
        port: "{{ item.port }}"
        state: stopped
        connect_timeout: 5
        timeout: 10
      changed_when: false
      no_log: true
      loop: "{{ management_exposure_public_negative_checks }}"
      loop_control:
        label: "public-negative-check"
      when: management_exposure_stage != 'pre-lockdown'

    - name: Verify WireGuard Kubernetes API access after K3s installation
      ansible.builtin.uri:
        url: "{{ item.url }}"
        method: GET
        return_content: false
        status_code: 200
      changed_when: false
      no_log: true
      loop: "{{ management_exposure_wg_api_checks }}"
      loop_control:
        label: "wireguard-api-check"
      when: management_exposure_stage == 'post-k3s'

---
# 이 파일은 스키마와 사용법을 보여주는 예시다. 실제 인벤토리는 커밋하지 않는다.
#
#   gabiactl inventory -f infra/bootstrap/desired-infrastructure.yaml \
#     --connect-via private -o .runtime/inventory.yaml
#   ansible-playbook -i .runtime/inventory.yaml ansible/playbooks/site.yml
#
# .runtime/inventory.yaml 은 위 형식과 동일해야 한다.

all:
  vars:
    ansible_user: ansible
    vpc_cidr: "10.0.0.0/24"          # 실행 시 실제 값으로 대체된다
  children:
    k3s_first_server:
      hosts:
        k3s-01:
          ansible_host: "10.0.0.11"  # placeholder — 실제 사설 IP
          private_ip: "10.0.0.11"
          public_ip: "192.0.2.11"
    k3s_servers:
      hosts:
        k3s-01:
          ansible_host: "10.0.0.11"
          private_ip: "10.0.0.11"
          public_ip: "192.0.2.11"
        k3s-02:
          ansible_host: "10.0.0.12"
          private_ip: "10.0.0.12"
          public_ip: "192.0.2.12"
        k3s-03:
          ansible_host: "10.0.0.13"
          private_ip: "10.0.0.13"
          public_ip: "192.0.2.13"
    management_gateways:
      hosts:
        k3s-01:
          wireguard_address: "10.99.1.1/24"
          wireguard_network_cidr: "10.99.1.0/24"
          wireguard_private_key: "{{ lookup('env', 'WG_K3S_01_PRIVATE_KEY') }}"
        k3s-02:
          wireguard_address: "10.99.2.1/24"
          wireguard_network_cidr: "10.99.2.0/24"
          wireguard_private_key: "{{ lookup('env', 'WG_K3S_02_PRIVATE_KEY') }}"

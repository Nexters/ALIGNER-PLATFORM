---
- name: Tailscale 배포 승인과 대상 확인
  ansible.builtin.assert:
    that:
      - management_network_tailscale_runtime_approved | bool
      - groups['all'] | sort == ['k3s-01', 'k3s-02', 'k3s-03']
      - inventory_hostname in ['k3s-01', 'k3s-02', 'k3s-03']
      - ansible_distribution == 'Ubuntu'
      - ansible_distribution_version is version('24.04', '==')
      - ansible_distribution_release == 'noble'
      - management_network_tailscale_version is match('^[0-9]+\\.[0-9]+\\.[0-9]+$')
      - management_network_tailscale_server_tag is match('^tag:[a-z0-9-]+$')
    fail_msg: >-
      Tailscale deployment is intentionally blocked. Approve the exact three-node
      inventory and inject a tagged bootstrap auth key through an ignored 0600 file.

- name: Tailscale 저장소 서명 키 설치
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    checksum: "sha256:{{ management_network_tailscale_repo_key_sha256 }}"
    owner: root
    group: root
    mode: "0644"

- name: Tailscale stable 저장소 구성
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
      https://pkgs.tailscale.com/stable/ubuntu noble main
    filename: tailscale
    state: present

- name: 고정 버전 Tailscale 설치
  ansible.builtin.apt:
    name: "tailscale={{ management_network_tailscale_version }}"
    state: present
    update_cache: true

- name: Tailscale daemon 활성화
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started

- name: Tailscale 인증 상태 확인
  ansible.builtin.command:
    argv: [tailscale, status, --json]
  register: management_network_tailscale_status_before
  changed_when: false
  failed_when: false

- name: Tailscale 인증 필요 여부 결정
  ansible.builtin.set_fact:
    management_network_tailscale_needs_auth: >-
      {{ management_network_tailscale_status_before.rc != 0 or
         ((management_network_tailscale_status_before.stdout | default('{}', true) | from_json).BackendState
          | default('')) != 'Running' }}

- name: 로컬 bootstrap key 파일 확인
  ansible.builtin.stat:
    path: "{{ management_network_tailscale_auth_key_file }}"
  register: management_network_tailscale_local_auth_key
  delegate_to: localhost
  become: false
  when: management_network_tailscale_needs_auth | bool

- name: Bootstrap key 파일 보안 계약 확인
  ansible.builtin.assert:
    that:
      - management_network_tailscale_auth_key_file | length > 0
      - management_network_tailscale_local_auth_key.stat.exists
      - management_network_tailscale_local_auth_key.stat.isreg
      - not management_network_tailscale_local_auth_key.stat.islnk
      - management_network_tailscale_local_auth_key.stat.mode in ['0400', '0600']
    fail_msg: Tailscale bootstrap key must be an ignored regular file with mode 0400 or 0600.
  when: management_network_tailscale_needs_auth | bool

- name: Tagged Tailscale server 인증
  when: management_network_tailscale_needs_auth | bool
  block:
    - name: Bootstrap key를 원격 tmpfs에 임시 배치
      ansible.builtin.copy:
        src: "{{ management_network_tailscale_auth_key_file }}"
        dest: "{{ management_network_tailscale_remote_auth_key_file }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: 서버를 Tailscale tailnet에 등록
      ansible.builtin.command:
        argv:
          - tailscale
          - up
          - "--auth-key=file:{{ management_network_tailscale_remote_auth_key_file }}"
          - "--hostname={{ inventory_hostname }}"
          - "--advertise-tags={{ management_network_tailscale_server_tag }}"
          - --accept-routes=false
          - --accept-dns=false
      no_log: true
      changed_when: true

  always:
    - name: 원격 bootstrap key 즉시 제거
      ansible.builtin.file:
        path: "{{ management_network_tailscale_remote_auth_key_file }}"
        state: absent
      no_log: true

- name: Tailscale 서버 설정 고정
  ansible.builtin.command:
    argv:
      - tailscale
      - set
      - "--hostname={{ inventory_hostname }}"
      - --accept-routes=false
      - --accept-dns=false
      - --ssh=false
      - --auto-update=false
  changed_when: false

- name: Tailscale 최종 상태 확인
  ansible.builtin.command:
    argv: [tailscale, status, --json]
  register: management_network_tailscale_status_after
  changed_when: false

- name: Tagged Tailscale 관리 경로 검증
  ansible.builtin.assert:
    that:
      - (management_network_tailscale_status_after.stdout | from_json).BackendState == 'Running'
      - (management_network_tailscale_status_after.stdout | from_json).Self.HostName == inventory_hostname
      - >-
        management_network_tailscale_server_tag in
        ((management_network_tailscale_status_after.stdout | from_json).Self.Tags | default([]))
    fail_msg: Tailscale did not establish the expected tagged management identity.

---
- name: Derive firewall interfaces from gathered facts
  ansible.builtin.set_fact:
    firewall_private_interfaces: >-
      {{ ansible_facts | dict2items | selectattr('value.ipv4', 'defined')
      | selectattr('value.ipv4', 'mapping')
      | selectattr('value.ipv4.address', 'equalto', private_ip) | map(attribute='key') | list }}
    firewall_k3s_node_private_ips: >-
      {{ groups['k3s_servers'] | map('extract', hostvars, 'private_ip') | list | sort }}
  changed_when: false

- name: Read Tailscale identity before firewall mutation
  ansible.builtin.command:
    argv: [tailscale, status, --json]
  register: firewall_tailscale_status
  changed_when: false

- name: Stop before firewall mutation without per-node Tailscale proof
  ansible.builtin.assert:
    that:
      - firewall_runtime_approved | bool
      - firewall_tailscale_access_proven | bool
      - private_ip in ansible_all_ipv4_addresses
      - firewall_private_interfaces | length == 1
      - firewall_tailscale_interface in ansible_interfaces
      - (firewall_tailscale_status.stdout | from_json).BackendState == 'Running'
      - (firewall_tailscale_status.stdout | from_json).Self.HostName == inventory_hostname
      - >-
        firewall_tailscale_server_tag in
        ((firewall_tailscale_status.stdout | from_json).Self.Tags | default([]))
      - firewall_k3s_node_private_ips | length == 3
      - firewall_k3s_node_private_ips | unique | length == 3
      - firewall_gabia_lb_private_ip is match('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$')
      - firewall_gabia_lb_private_ip not in firewall_k3s_node_private_ips
    fail_msg: >-
      Firewall is intentionally not applied. Set the explicit approval and per-node
      proof only after the tagged Tailscale identity and SSH path are verified.

- name: Check new Tailscale OpenSSH path before firewall mutation
  ansible.builtin.wait_for:
    host: "{{ inventory_hostname }}"
    port: 22
    state: started
    connect_timeout: 5
    timeout: 10
  delegate_to: localhost
  become: false

- name: Check optional new Tailscale API path before firewall mutation
  ansible.builtin.command:
    argv: "{{ firewall_tailscale_api_check_command }}"
  changed_when: false
  delegate_to: localhost
  become: false
  no_log: true
  when: firewall_tailscale_api_check_command | length > 0

- name: Apply persistent host firewall one node at a time
  block:
    - name: Install nftables
      ansible.builtin.package:
        name: nftables
        state: present

    - name: Create dedicated nftables include directory
      ansible.builtin.file:
        path: /etc/nftables.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Mark firewall replacement as not started
      ansible.builtin.set_fact:
        firewall_apply_started: false
      changed_when: false

    - name: Check whether dedicated firewall include exists before backup
      ansible.builtin.stat:
        path: /etc/nftables.d/aligner.nft
      register: firewall_aligner_include

    - name: Save dedicated firewall include for rollback
      ansible.builtin.copy:
        src: /etc/nftables.d/aligner.nft
        dest: /etc/nftables.d/aligner.nft.aligner-pre-firewall
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      when: firewall_aligner_include.stat.exists

    - name: Check for existing dedicated firewall table  # noqa no-handler
      ansible.builtin.command:
        argv:
          - nft
          - list
          - table
          - inet
          - aligner_firewall
      register: firewall_aligner_table
      changed_when: false
      failed_when: false

    - name: Render validated firewall candidate
      ansible.builtin.template:
        src: aligner.nft.j2
        dest: /etc/nftables.d/aligner.nft.candidate
        owner: root
        group: root
        mode: "0600"

    - name: Check firewall candidate syntax
      ansible.builtin.command:
        argv:
          - nft
          - --check
          - --file
          - /etc/nftables.d/aligner.nft.candidate
      changed_when: false

    - name: Persist dedicated nftables include contract
      ansible.builtin.lineinfile:
        path: /etc/nftables.conf
        line: 'include "/etc/nftables.d/*.nft"'
        create: true
        owner: root
        group: root
        mode: "0644"
      register: firewall_root_include

    - name: Persist dedicated firewall include
      ansible.builtin.copy:
        src: /etc/nftables.d/aligner.nft.candidate
        dest: /etc/nftables.d/aligner.nft
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      register: firewall_persisted

    - name: Mark firewall replacement as started
      ansible.builtin.set_fact:
        firewall_apply_started: true
      changed_when: false
      when: firewall_persisted.changed or firewall_root_include.changed

    - name: Check complete persistent nftables configuration
      ansible.builtin.command:
        argv:
          - nft
          - --check
          - --file
          - /etc/nftables.conf
      changed_when: false

    - name: Decide whether dedicated firewall requires reconciliation
      ansible.builtin.set_fact:
        firewall_reconcile_required: >-
          {{ firewall_persisted.changed or firewall_aligner_table.rc != 0 }}
      changed_when: false

    - name: Mark live firewall replacement as started
      ansible.builtin.set_fact:
        firewall_apply_started: true
      changed_when: false
      when: firewall_reconcile_required | bool

    - name: Remove existing dedicated firewall table before replacement
      ansible.builtin.command:
        argv:
          - nft
          - destroy
          - table
          - inet
          - aligner_firewall
      changed_when: true
      when:
        - firewall_reconcile_required | bool
        - firewall_aligner_table.rc | default(1) == 0

    - name: Load dedicated firewall include  # noqa no-handler
      ansible.builtin.command:
        argv:
          - nft
          - --file
          - /etc/nftables.d/aligner.nft
      changed_when: true
      when: firewall_reconcile_required | bool

    - name: Enable nftables at reboot
      ansible.builtin.service:
        name: nftables
        enabled: true

    - name: Check new Tailscale OpenSSH path after firewall change
      ansible.builtin.wait_for:
        host: "{{ inventory_hostname }}"
        port: 22
        state: started
        connect_timeout: 5
        timeout: 10
      delegate_to: localhost
      become: false
      no_log: true

    - name: Check optional new Tailscale API path after firewall change
      ansible.builtin.command:
        argv: "{{ firewall_tailscale_api_check_command }}"
      changed_when: false
      delegate_to: localhost
      become: false
      no_log: true
      when: firewall_tailscale_api_check_command | length > 0

  rescue:
    - name: Remove failed firewall table
      ansible.builtin.command:
        argv:
          - nft
          - destroy
          - table
          - inet
          - aligner_firewall
      changed_when: true
      failed_when: false
      when: firewall_apply_started | default(false) | bool

    - name: Restore dedicated firewall include
      ansible.builtin.copy:
        src: /etc/nftables.d/aligner.nft.aligner-pre-firewall
        dest: /etc/nftables.d/aligner.nft
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      when:
        - firewall_aligner_include is defined
        - firewall_aligner_include.stat.exists

    - name: Remove dedicated include created during failed firewall apply
      ansible.builtin.file:
        path: /etc/nftables.d/aligner.nft
        state: absent
      when:
        - firewall_aligner_include is defined
        - not firewall_aligner_include.stat.exists

    - name: Reload dedicated firewall include
      ansible.builtin.command:
        argv:
          - nft
          - --file
          - /etc/nftables.d/aligner.nft
      changed_when: true
      when:
        - firewall_apply_started | default(false) | bool
        - firewall_aligner_include is defined
        - firewall_aligner_include.stat.exists

    - name: Remove root include added by failed firewall apply
      ansible.builtin.lineinfile:
        path: /etc/nftables.conf
        line: 'include "/etc/nftables.d/*.nft"'
        state: absent
      when:
        - firewall_root_include is defined
        - firewall_root_include.changed

    - name: Stop after rollback
      ansible.builtin.fail:
        msg: Firewall post-check failed; this node was restored and the serial play stopped.

  always:
    - name: Remove firewall candidate
      ansible.builtin.file:
        path: /etc/nftables.d/aligner.nft.candidate
        state: absent

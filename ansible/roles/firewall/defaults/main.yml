---
# Both values must be set per node only after an operator has verified Tailscale.
# Their false defaults guarantee no host mutation.
firewall_runtime_approved: false
firewall_tailscale_access_proven: false

# Runtime-only values. Keep endpoint addresses and SSH options out of git when
# they reveal operational topology.
firewall_tailscale_interface: tailscale0
firewall_tailscale_server_tag: "tag:aligner-prod"
firewall_vpc_cidr: "10.20.0.0/16"
firewall_gabia_lb_private_ip: ""
firewall_tailscale_ssh_check_command: []
# K3s is installed after this role. Supply a read-only API command only when an
# existing API is already reachable through Tailscale; otherwise #22 verifies it.
firewall_tailscale_api_check_command: []
firewall_nodeport_range: "30000-32767"

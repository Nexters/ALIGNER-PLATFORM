---
# Cilium은 컨트롤 머신에서 Helm으로 설치한다.
# K3s auto-deploy 대신 L2가 CNI 부트스트랩을 소유한다.
#
# 전제: 이 role은 site.yml 에서 hosts: localhost, connection: local 로 실행된다.
#       k3s 첫 서버가 부트스트랩되어 kubeconfig 를 가져올 수 있는 상태여야 한다.

- name: Require the reviewed Cilium version
  ansible.builtin.assert:
    that:
      - cilium_version == '1.20.0'
    fail_msg: Cilium version must remain pinned to 1.20.0 until reviewed.

- name: Runtime 디렉터리 생성
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../../.runtime"
    state: directory
    mode: "0700"

- name: Kubeconfig를 컨트롤 머신으로 가져오기
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ playbook_dir }}/../../.runtime/kubeconfig"
    flat: true
  delegate_to: "{{ groups['k3s_first_server'][0] }}"
  become: true

- name: Kubeconfig API 주소를 WireGuard 경유 사설 IP로 변경
  vars:
    k3s_first_server_private_ip: >-
      {{ hostvars[groups['k3s_first_server'][0]]['private_ip'] }}
  ansible.builtin.replace:
    path: "{{ playbook_dir }}/../../.runtime/kubeconfig"
    regexp: 'server: https://127\.0\.0\.1:6443'
    replace: "server: https://{{ k3s_first_server_private_ip }}:6443"
    mode: "0600"

- name: Cilium Helm repo 추가
  kubernetes.core.helm_repository:
    name: cilium
    repo_url: https://helm.cilium.io/

- name: Cilium 설치 — 클러스터 밖에서 API 호출
  kubernetes.core.helm:
    name: cilium
    chart_ref: cilium/cilium
    chart_version: "{{ cilium_version }}"
    release_namespace: kube-system
    kubeconfig: "{{ playbook_dir }}/../../.runtime/kubeconfig"
    values_files:
      - "{{ role_path }}/files/cilium-values.yaml"
    set_values:
      # cluster_cidr 은 group_vars 에서 확정된 값을 그대로 쓴다 (사후 변경 불가)
      - value: ipam.operator.clusterPoolIPv4PodCIDRList[0]={{ cluster_cidr }}
        value_type: string
    wait: true
    wait_timeout: 10m

- name: Wait for Cilium agents to be ready
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig={{ playbook_dir }}/../../.runtime/kubeconfig
      - -n
      - kube-system
      - rollout
      - status
      - daemonset/cilium
      - --timeout=10m
  changed_when: false

- name: Wait for Cilium operator to be ready
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig={{ playbook_dir }}/../../.runtime/kubeconfig
      - -n
      - kube-system
      - rollout
      - status
      - deployment/cilium-operator
      - --timeout=10m
  changed_when: false

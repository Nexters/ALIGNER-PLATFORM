# gabiactl 목표 상태 정의. 실제 값(리전, 이미지 ID 등)은 §1.6 API endpoint matrix
# 확정 후 채운다. 이 파일은 정본이지만 실제 인증정보는 포함하지 않는다.
#
# 실행: infisical run --projectId=$ALIGNER_INFRA --env=prod --path=/gabia -- \
#         gabiactl apply --file infra/bootstrap/desired-infrastructure.yaml

version: "REPLACE_ME"  # gabiactl 스키마 버전 — Phase 0 endpoint matrix 확정 후

network:
  vpc_cidr: "REPLACE_ME"
  subnet_cidr: "REPLACE_ME"

servers:
  os_image: "Ubuntu-24.04"   # 설계 문서 §7판 — OS 동결 (커널 6.8, Cilium 5.10+ 요구 충족)
  flavor: "standard-2-8"     # 2 vCPU / 8GB
  count: 3
  names: ["k3s-01", "k3s-02", "k3s-03"]

volumes:
  data_a_gb: 25   # etcd + containerd 이미지 + kubelet
  data_b_gb: 40   # PostgreSQL local-path PV

load_balancer:
  listeners:
    - { port: 443, protocol: HTTPS, target_port: 30443 }
    - { port: 80, protocol: HTTP, target_port: 30080 }
    # 6443 리스너는 만들지 않는다 — 관리망(WireGuard/Tailscale) 경유로만 접근한다

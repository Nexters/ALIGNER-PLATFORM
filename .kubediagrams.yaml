# Configuration of kube-diagrams for ALIGNER-PLATFORM
# File: /Users/donghoon/IdeaProjects/nexters/ALIGNER-PLATFORM/.kubediagrams.yaml

default_namespace: default

edges:
  REFERENCE:
    color: "#2b2d42"
  REFERENCE-UP:
    color: "#2b2d42"
    direction: up
  SELECTOR:
    color: "#4361ee"
    style: dashed
  SELECTOR-UP:
    color: "#4361ee"
    style: dashed
    direction: up
  CONTROLLED_BY:
    xlabel: controller
    color: "#7209b7"
    style: dotted
  OWNER:
    color: "#3a0ca3"
    style: dotted
  COMMUNICATION:
    color: "#e63946"
  DEPENDENCE:
    color: "#6c757d"
  INVISIBLE:
    color: transparent
    style: invisible
    direction: up

clusters:
  - label: app.kubernetes.io/instance
    title: "Instance: {}"
    recommended: true
    graph_attr:
      bgcolor: "#E5F5FD"
      style: rounded
  - label: app.kubernetes.io/part-of
    title: "System: {}"
    recommended: true
    graph_attr:
      bgcolor: "#F3F4F6"
      style: rounded,dashed
  - label: app.kubernetes.io/name
    title: "Application: {}"
    recommended: true
    graph_attr:
      bgcolor: "#ECE8F6"
      style: rounded
  - label: app.kubernetes.io/component
    title: "Component: {}"
    recommended: true
    graph_attr:
      bgcolor: "#FDF7E3"
      style: rounded

nodes:
  # ---------------------------------------------------------------------------
  # CloudNativePG PostgreSQL Cluster & Backups
  # ---------------------------------------------------------------------------
  Cluster/postgresql.cnpg.io/v1:
    scope: Namespaced
    diagram_node_classname: diagrams.onprem.database.PostgreSQL
    nodes: |
      name = get_name(resource)
      ns = get_namespace(resource)
      # Automatically synthesize the primary read-write Service managed by CloudNativePG
      svc = {
        "apiVersion": "v1",
        "kind": "Service",
        "metadata": {
          "name": f"{name}-rw",
          "namespace": ns,
          "labels": {
            "cnpg.io/cluster": name,
            "app.kubernetes.io/name": f"{name}-rw",
            "app.kubernetes.io/part-of": "aligner",
          }
        },
        "spec": {
          "selector": {
            "cnpg.io/cluster": name,
          },
          "ports": [
            {
              "name": "postgresql",
              "port": 5432,
              "targetPort": 5432,
              "protocol": "TCP"
            }
          ]
        }
      }
      nodes.append(svc)
    edges: |
      # Initdb bootstrap secret
      secret_name = query_path(resource, "spec.bootstrap.initdb.secret.name")
      if secret_name:
        edges.add_edge_to(
          "spec.bootstrap.initdb.secret.name",
          secret_name,
          get_namespace(resource),
          "Secret",
          "v1",
          "REFERENCE"
        )
      # StorageClass
      storage_class = query_path(resource, "spec.storage.storageClass")
      if storage_class:
        edges.add_edge_to(
          "spec.storage.storageClass",
          storage_class,
          None,
          "StorageClass",
          "storage.k8s.io/v1",
          "REFERENCE"
        )
      # Barman Object Store Plugin
      for pidx, plugin in enumerate(query_path(resource, "spec.plugins", [])):
        barman_obj = query_path(plugin, "parameters.barmanObjectName")
        if barman_obj:
          edges.add_edge_to(
            f"spec.plugins[{pidx}].barmanObjectName",
            barman_obj,
            get_namespace(resource),
            "ObjectStore",
            "barmancloud.cnpg.io/v1",
            "REFERENCE"
          )
      # Certificates / TLS secrets
      for cert_key in ["serverTLSSecret", "serverCASecret", "clientCASecret"]:
        cert_sec = query_path(resource, f"spec.certificates.{cert_key}")
        if cert_sec:
          edges.add_edge_to(
            f"spec.certificates.{cert_key}",
            cert_sec,
            get_namespace(resource),
            "Secret",
            "v1",
            "REFERENCE"
          )

  Cluster/postgresql.cnpg.io/v1beta1: Cluster/postgresql.cnpg.io/v1
  Cluster/postgresql.cnpg.io/v1alpha1: Cluster/postgresql.cnpg.io/v1

  ScheduledBackup/postgresql.cnpg.io/v1:
    scope: Namespaced
    diagram_node_classname: diagrams.onprem.database.PostgreSQL
    edges: |
      cluster_name = query_path(resource, "spec.cluster.name")
      if cluster_name:
        edges.add_edge_to(
          "spec.cluster.name",
          cluster_name,
          get_namespace(resource),
          "Cluster",
          "postgresql.cnpg.io/v1",
          "REFERENCE"
        )

  ObjectStore/barmancloud.cnpg.io/v1:
    scope: Namespaced
    diagram_node_classname: diagrams.onprem.database.PostgreSQL

  # ---------------------------------------------------------------------------
  # External Secrets Operator (ExternalSecret, SecretStore, ClusterSecretStore)
  # ---------------------------------------------------------------------------
  ExternalSecret/external-secrets.io/v1beta1:
    scope: Namespaced
    diagram_node_classname: diagrams.k8s.podconfig.Secret
    edges: |
      store_ref = query_path(resource, "spec.secretStoreRef")
      if store_ref is not None:
        store_kind = store_ref.get("kind", "SecretStore")
        store_name = store_ref.get("name")
        store_group = store_ref.get("group", "external-secrets.io")
        store_ns = get_namespace(resource) if store_kind == "SecretStore" else None
        
        # Check matching version in resources
        matched = False
        for s_ver in ["v1", "v1beta1", "v1alpha1"]:
          api_ver = f"{store_group}/{s_ver}" if store_group else f"external-secrets.io/{s_ver}"
          s_rid = f"{store_name}/{store_ns}/{store_kind}/{api_ver}" if store_ns else f"{store_name}/{store_kind}/{api_ver}"
          if s_rid in resources:
            edges.add_edge_to_rid("spec.secretStoreRef", s_rid, "REFERENCE", store_ref)
            matched = True
            break
        if not matched:
          api_ver = f"{store_group}/v1" if store_group else "external-secrets.io/v1"
          edges.add_edge_to(
            "spec.secretStoreRef",
            store_name,
            store_ns,
            store_kind,
            api_ver,
            "REFERENCE",
            data=store_ref
          )

      target_name = query_path(resource, "spec.target.name") or get_name(resource)
      if target_name:
        target_rid = f"{target_name}/{get_namespace(resource)}/Secret/v1"
        if target_rid in resources:
          edges.add_edge_to_rid("spec.target.name", target_rid, "OWNER")
        else:
          edges.add_edge_to(
            "spec.target.name",
            target_name,
            get_namespace(resource),
            "Secret",
            "v1",
            "OWNER"
          )

  ExternalSecret/external-secrets.io/v1: ExternalSecret/external-secrets.io/v1beta1
  ExternalSecret/external-secrets.io/v1alpha1: ExternalSecret/external-secrets.io/v1beta1

  SecretStore/external-secrets.io/v1beta1:
    scope: Namespaced
    diagram_node_classname: diagrams.k8s.podconfig.Secret
    edges: |
      auth = query_path(resource, "spec.provider.infisical.auth.universalAuthCredentials")
      if auth is not None:
        cid = query_path(auth, "clientId.name")
        if cid:
          edges.add_edge_to(
            "spec.provider.infisical.auth.universalAuthCredentials.clientId",
            cid,
            get_namespace(resource),
            "Secret",
            "v1",
            "REFERENCE"
          )
        csec = query_path(auth, "clientSecret.name")
        if csec:
          edges.add_edge_to(
            "spec.provider.infisical.auth.universalAuthCredentials.clientSecret",
            csec,
            get_namespace(resource),
            "Secret",
            "v1",
            "REFERENCE"
          )

  SecretStore/external-secrets.io/v1: SecretStore/external-secrets.io/v1beta1
  SecretStore/external-secrets.io/v1alpha1: SecretStore/external-secrets.io/v1beta1

  ClusterSecretStore/external-secrets.io/v1beta1:
    scope: Cluster
    diagram_node_classname: diagrams.k8s.podconfig.Secret
    edges: |
      auth = query_path(resource, "spec.provider.infisical.auth.universalAuthCredentials")
      if auth is not None:
        cid = query_path(auth, "clientId.name")
        if cid:
          edges.add_edge_to(
            "spec.provider.infisical.auth.universalAuthCredentials.clientId",
            cid,
            "default",
            "Secret",
            "v1",
            "REFERENCE"
          )
        csec = query_path(auth, "clientSecret.name")
        if csec:
          edges.add_edge_to(
            "spec.provider.infisical.auth.universalAuthCredentials.clientSecret",
            csec,
            "default",
            "Secret",
            "v1",
            "REFERENCE"
          )

  ClusterSecretStore/external-secrets.io/v1: ClusterSecretStore/external-secrets.io/v1beta1
  ClusterSecretStore/external-secrets.io/v1alpha1: ClusterSecretStore/external-secrets.io/v1beta1

  # ---------------------------------------------------------------------------
  # Argo CD Application
  # ---------------------------------------------------------------------------
  Application/argoproj.io/v1alpha1:
    scope: Namespaced
    diagram_node_classname: diagrams.onprem.gitops.Argocd
    edges: |
      dest_ns = query_path(resource, "spec.destination.namespace")
      if dest_ns:
        edges.add_edge_to(
          "spec.destination.namespace",
          dest_ns,
          None,
          "Namespace",
          "v1",
          "REFERENCE"
        )

  # ---------------------------------------------------------------------------
  # Cert-Manager (Certificate, ClusterIssuer, Issuer)
  # ---------------------------------------------------------------------------
  Certificate/cert-manager.io/v1:
    scope: Namespaced
    diagram_node_classname: diagrams.onprem.certificates.CertManager
    nodes: |
      secret_name = query_path(resource, "spec.secretName")
      if secret_name:
        ns = get_namespace(resource)
        secret_node = {
          "apiVersion": "v1",
          "kind": "Secret",
          "metadata": {
            "name": secret_name,
            "namespace": ns,
            "labels": query_path(resource, "metadata.labels", {})
          },
          "type": "kubernetes.io/tls"
        }
        nodes.append(secret_node)
    edges: |
      issuer_ref = query_path(resource, "spec.issuerRef")
      if issuer_ref is not None:
        issuer_kind = issuer_ref.get("kind", "Issuer")
        issuer_name = issuer_ref.get("name")
        issuer_group = issuer_ref.get("group", "cert-manager.io")
        issuer_ns = get_namespace(resource) if issuer_kind == "Issuer" else None
        edges.add_edge_to(
          "spec.issuerRef",
          issuer_name,
          issuer_ns,
          issuer_kind,
          f"{issuer_group}/v1" if issuer_group else "cert-manager.io/v1",
          "REFERENCE",
          data=issuer_ref
        )
      secret_name = query_path(resource, "spec.secretName")
      if secret_name:
        edges.add_edge_to(
          "spec.secretName",
          secret_name,
          get_namespace(resource),
          "Secret",
          "v1",
          "OWNER"
        )

  Certificate/cert-manager.io/v1beta1: Certificate/cert-manager.io/v1
  Certificate/cert-manager.io/v1alpha2: Certificate/cert-manager.io/v1

  ClusterIssuer/cert-manager.io/v1:
    scope: Cluster
    diagram_node_classname: diagrams.onprem.certificates.CertManager
    edges: |
      priv_key = query_path(resource, "spec.acme.privateKeySecretRef.name")
      if priv_key:
        edges.add_edge_to(
          "spec.acme.privateKeySecretRef",
          priv_key,
          "cert-manager",
          "Secret",
          "v1",
          "REFERENCE"
        )
      for idxs, solver in enumerate(query_path(resource, "spec.acme.solvers", [])):
        for idxp, pref in enumerate(query_path(solver, "http01.gatewayHTTPRoute.parentRefs", [])):
          edges.add_edge_to(
            f"spec.acme.solvers[{idxs}].http01.gatewayHTTPRoute.parentRefs[{idxp}]",
            pref.get("name"),
            pref.get("namespace", "traefik"),
            pref.get("kind", "Gateway"),
            "gateway.networking.k8s.io/v1",
            "REFERENCE"
          )

  ClusterIssuer/cert-manager.io/v1beta1: ClusterIssuer/cert-manager.io/v1
  ClusterIssuer/cert-manager.io/v1alpha2: ClusterIssuer/cert-manager.io/v1

  Issuer/cert-manager.io/v1:
    scope: Namespaced
    diagram_node_classname: diagrams.onprem.certificates.CertManager
    edges: |
      priv_key = query_path(resource, "spec.acme.privateKeySecretRef.name")
      if priv_key:
        edges.add_edge_to(
          "spec.acme.privateKeySecretRef",
          priv_key,
          get_namespace(resource),
          "Secret",
          "v1",
          "REFERENCE"
        )
      for idxs, solver in enumerate(query_path(resource, "spec.acme.solvers", [])):
        for idxp, pref in enumerate(query_path(solver, "http01.gatewayHTTPRoute.parentRefs", [])):
          edges.add_edge_to(
            f"spec.acme.solvers[{idxs}].http01.gatewayHTTPRoute.parentRefs[{idxp}]",
            pref.get("name"),
            pref.get("namespace", get_namespace(resource)),
            pref.get("kind", "Gateway"),
            "gateway.networking.k8s.io/v1",
            "REFERENCE"
          )

  Issuer/cert-manager.io/v1beta1: Issuer/cert-manager.io/v1
  Issuer/cert-manager.io/v1alpha2: Issuer/cert-manager.io/v1

  # ---------------------------------------------------------------------------
  # Gateway API (Gateway & HTTPRoute Enhancement with cross-namespace resolution)
  # ---------------------------------------------------------------------------
  HTTPRoute/gateway.networking.k8s.io/v1:
    scope: Namespaced
    custom_icon: $KD/icons/HTTPRoute.png
    edges: |
      # spec.parentRefs.* (Gateway -> HTTPRoute via REFERENCE-UP)
      for idx, parentRef in enumerate(query_path(resource, "spec.parentRefs", [])):
        p_name = parentRef.get('name')
        p_ns = parentRef.get("namespace") or get_namespace(resource)
        p_group = parentRef.get("group", "gateway.networking.k8s.io")
        p_kind = parentRef.get('kind', "Gateway")
        p_ver = f"{p_group}/v1"
        p_rid = f"{p_name}/{p_ns}/{p_kind}/{p_ver}"
        if p_rid not in resources and parentRef.get("namespace") is None:
          for other_rid in resources:
            if other_rid.startswith(f"{p_name}/") and f"/{p_kind}/{p_ver}" in other_rid:
              p_rid = other_rid
              break
        if p_rid in resources:
          edges.add_edge_to_rid(f"spec.parentRefs[{idx}]", p_rid, "REFERENCE-UP", parentRef)
        else:
          edges.add_edge_to(
            f"spec.parentRefs[{idx}]",
            p_name,
            p_ns,
            p_kind,
            p_ver,
            "REFERENCE-UP",
            data=parentRef
          )
      # spec.rules.*.backendRefs.* (HTTPRoute -> Service via REFERENCE)
      for idxr, rule in enumerate(query_path(resource, "spec.rules", [])):
        for idxbr, backendRef in enumerate(query_path(rule, "backendRefs", [])):
          b_name = backendRef.get('name')
          b_ns = backendRef.get("namespace") or get_namespace(resource)
          b_group = backendRef.get("group", "")
          b_kind = backendRef.get('kind', "Service")
          b_ver = f"{b_group}/v1" if b_group != "" else "v1"
          b_rid = f"{b_name}/{b_ns}/{b_kind}/{b_ver}"
          if b_rid not in resources and backendRef.get("namespace") is None:
            for other_rid in resources:
              if other_rid.startswith(f"{b_name}/") and f"/{b_kind}/{b_ver}" in other_rid:
                b_rid = other_rid
                break
          if b_rid in resources:
            edges.add_edge_to_rid(f"spec.rules[{idxr}].backendRefs[{idxbr}]", b_rid, "REFERENCE", backendRef)
          else:
            edges.add_edge_to(
              f"spec.rules[{idxr}].backendRefs[{idxbr}]",
              b_name,
              b_ns,
              b_kind,
              b_ver,
              "REFERENCE",
              data=backendRef
            )

  # ---------------------------------------------------------------------------
  # Service Extension (Connects Service to Workloads & CNPG PostgreSQL Clusters)
  # ---------------------------------------------------------------------------
  Service/v1:
    scope: Namespaced
    diagram_node_classname: diagrams.k8s.network.SVC
    edges: |
      edges.add_edges_for_service()
      # Connect CNPG Service to PostgreSQL Cluster
      svc_name = get_name(resource)
      svc_ns = get_namespace(resource)
      for rid, res in resources.items():
        if res.get("kind") == "Cluster" and "postgresql.cnpg.io" in res.get("apiVersion", ""):
          cl_name = get_name(res)
          cl_ns = get_namespace(res)
          if (svc_ns == cl_ns or svc_ns == "default" or cl_ns == "default") and (
              svc_name == f"{cl_name}-rw" or svc_name == f"{cl_name}-ro" or svc_name == f"{cl_name}-r" or svc_name == cl_name or
              query_path(resource, "spec.selector.cnpg\\.io/cluster") == cl_name
          ):
            edge_config = {
              **get_edge_config("SELECTOR"),
              "xlabel": "5432/TCP",
              "fontsize": "10"
            }
            edges.add_edge_to_rid("cnpg.io/cluster", rid, edge_config)

  # ---------------------------------------------------------------------------
  # Tailscale Operator CRDs
  # ---------------------------------------------------------------------------
  ProxyClass/tailscale.com/v1alpha1:
    scope: Cluster
    diagram_node_classname: diagrams.k8s.network.Ingress

  ProxyGroup/tailscale.com/v1alpha1:
    scope: Cluster
    diagram_node_classname: diagrams.k8s.network.Ingress

  # ---------------------------------------------------------------------------
  # Kustomization meta resources (Hidden from diagrams)
  # ---------------------------------------------------------------------------
  Kustomization/kustomize.config.k8s.io/v1beta1:
    show: false
  Kustomization/kustomize.config.k8s.io/v1:
    show: false

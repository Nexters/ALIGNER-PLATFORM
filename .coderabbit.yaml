language: "ko-KR"
tone_instructions: >
  리뷰는 한글로 작성한다. 이 저장소는 K3s/Ansible/GitOps 인프라 코드이며,
  실제 서비스 프로덕션 오픈 전 단계다. 추측이나 일반론보다 이 저장소의 설계
  문서(docs/architecture/)에 근거한 구체적 피드백을 우선한다.

reviews:
  profile: "assertive"
  high_level_summary: true
  poem: false
  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: false

  path_filters:
    - "!docs/architecture/gabia-k3s-9month-design.md"
    - "!**/*.gitkeep"

  path_instructions:
    - path: "ansible/roles/management_network/**"
      instructions: >
        이 role은 firewall role보다 먼저 적용되고 검증되어야 한다.
        management_network 검증 없이 firewall이 22/6443 포트를 닫으면
        노드 접근이 완전히 끊기는 잠금 사고가 발생한다. site.yml의 role
        순서를 변경하는 코드가 있으면 반드시 지적한다.

    - path: "ansible/roles/firewall/**"
      instructions: >
        management_network role 검증 이후에만 적용되어야 한다.
        이 role 단독으로 순서를 바꾸거나 먼저 실행되게 하는 변경은 위험하다.

    - path: "ansible/roles/cilium/**"
      instructions: >
        cluster_cidr(10.42.0.0/16)은 Day 1 확정값이며 클러스터 생성 후
        변경이 불가능하다(Cilium cluster-pool IPAM 제약). 이 값을 바꾸는
        변경이 있으면 재구축이 필요하다는 점을 반드시 언급한다.
        kubeProxyReplacement, Hubble Relay/UI 활성화 여부도 설계 문서
        §2.3의 결정(false, 비활성)과 일치하는지 확인한다.

    - path: "gitops/infrastructure/controllers/external-secrets/**"
      instructions: >
        ESO(External Secrets Operator) 관련 변경이다. Infisical Project
        분리 원칙(aligner-infra / aligner-runtime)을 위반하지 않는지,
        ESO가 aligner-runtime 이외 Project에 접근하는 코드가 없는지 확인한다.

    - path: "gitops/infrastructure/configs/secret-stores/**"
      instructions: >
        SecretStore 정의다. 시크릿 값이 하드코딩되어 있지 않은지,
        Infisical Cloud를 정본으로 참조하는지 확인한다.

    - path: "infra/bootstrap/security-groups.yaml"
      instructions: >
        보안그룹 규칙이다. 0.0.0.0/0으로 열린 인바운드 규칙이나 불필요하게
        넓은 포트 범위가 있으면 반드시 지적한다.

    - path: "**/*.yml"
      instructions: >
        Ansible/GitHub Actions 워크플로다. GitHub Actions의 uses는 태그가
        아니라 커밋 SHA로 고정되어야 한다(공급망 공격 방지). 태그만 있는
        `uses:` 구문을 발견하면 지적한다.

    - path: ".github/workflows/**"
      instructions: >
        permissions가 필요한 범위로만 최소화되어 있는지 확인한다.
        contents: write, pull-requests: write 등은 실제로 필요한 경우에만
        존재해야 한다.

  tools:
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    checkov:
      enabled: true
    tflint:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "docs/architecture/**"
      - "docs/adr/**"
      - "CONTRIBUTING.md"
      - "SECURITY.md"

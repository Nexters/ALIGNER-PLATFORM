name: 장애·사고 (Incident)
description: 실제 장애, 훈련 결과, 또는 Gate 실패를 기록한다
labels: ["incident"]
body:
  - type: dropdown
    id: type
    attributes:
      label: 종류
      options:
        - "실제 장애"
        - "계획된 장애 훈련 (설계 문서 §Phase 1~3)"
        - "Gate 실패 (Cilium 자원·R2 acceptance test·CNPG node-loss 등)"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 무슨 일이 있었는가
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 영향
      placeholder: 서비스 영향 여부, 다운타임, degraded overlay 전환 여부
    validations:
      required: true

  - type: textarea
    id: followup
    attributes:
      label: 후속 조치
      placeholder: Runbook 갱신 필요 여부, ADR 작성 필요 여부

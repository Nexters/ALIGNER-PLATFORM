name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Reject committed Tailscale keys
        shell: bash
        run: |
          if git grep -I -q -E 'tskey-(auth|api|client)-[A-Za-z0-9_-]{10,}' $(git rev-list --all); then
            echo '::error::A Tailscale credential exists in Git history.'
            exit 1
          fi

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          # 실제로 살아있는 시크릿만 실패로 처리한다 (오탐 방지)
          # Lob detector 제외: Tailscale APT GPG 공개 키 SHA256 핑거프린트가 Lob API key로 오탐된다
          extra_args: --only-verified --exclude-detectors Lob

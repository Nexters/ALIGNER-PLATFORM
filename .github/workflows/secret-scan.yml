name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # gitleaks-action이 PR에 코멘트를 남기려면 필요

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Organization 저장소(Nexters/*)로 옮기면 무료 라이선스가 필요하다.
          # https://gitleaks.io 에서 발급 후 저장소 Secret으로 등록한다.
          # Personal 계정 저장소는 라이선스가 필요 없다.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
